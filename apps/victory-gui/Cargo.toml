[package]
name = "victory-gui"
description = "VIctory Optimized desktop GUI: build, test, benchmark, launch, diagnostics, Git."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "victory-gui"
path = "src/main.rs"

[dependencies]
victory-core.workspace = true
serde.workspace = true
toml.workspace = true
# Immediate-mode GUI; only the OpenGL backend and the built-in fonts.
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
] }
windows = { workspace = true, features = ["Win32_Graphics_Dxgi"] }

[lints]
workspace = true
